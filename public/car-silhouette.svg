<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Wheels / Tires -->
  <rect x="46" y="160" width="34" height="76" rx="8" fill="#1e293b" />
  <rect x="320" y="160" width="34" height="76" rx="8" fill="#1e293b" />
  <rect x="46" y="560" width="34" height="76" rx="8" fill="#1e293b" />
  <rect x="320" y="560" width="34" height="76" rx="8" fill="#1e293b" />

  <!-- Side Mirrors -->
  <path d="M 50 265 C 36 265 34 295 50 300 Z" fill="#475569" stroke="#334155" stroke-width="2" />
  <path d="M 350 265 C 364 265 366 295 350 300 Z" fill="#475569" stroke="#334155" stroke-width="2" />

  <!-- Car Chassis / Body -->
  <rect x="80" y="60" width="240" height="680" rx="48" fill="#e2e8f0" stroke="#334155" stroke-width="3" filter="url(#shadow)" />

  <!-- Front Bumper / Hood Area -->
  <path d="M 100 240 L 100 130 C 100 85 300 85 300 130 L 300 240 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />

  <!-- Headlights -->
  <rect x="105" y="85" width="40" height="18" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="2" />
  <rect x="255" y="85" width="40" height="18" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="2" />

  <!-- Front Windshield -->
  <path d="M 106 250 L 294 250 L 280 320 L 120 320 Z" fill="#334155" stroke="#1e293b" stroke-width="2" />

  <!-- Roof -->
  <rect x="115" y="330" width="170" height="160" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />

  <!-- Rear Windshield -->
  <path d="M 120 500 L 280 500 L 294 560 L 106 560 Z" fill="#334155" stroke="#1e293b" stroke-width="2" />

  <!-- Rear Trunk Area -->
  <path d="M 100 570 L 300 570 L 300 680 C 300 720 100 720 100 680 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />

  <!-- Taillights -->
  <rect x="105" y="695" width="42" height="18" rx="5" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <rect x="253" y="695" width="42" height="18" rx="5" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />

  <!-- Center Guidance Label (Discreet) -->
  <text x="200" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1">VISTA SUPERIOR</text>
  <text x="200" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">FRENTE</text>
  <text x="200" y="645" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">TRASERA</text>
</svg>
